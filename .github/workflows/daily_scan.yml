name: Daily Monthly Zone Scan

on:
  schedule:
    # 16:00 UTC = 21:30 IST (India) — market band hone ke baad
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: pip install -q yfinance pandas numpy

      - name: Refresh NSE symbol list
        run: python refresh_nse_list.py

      - name: Run monthly zone scan (full market)
        run: python scanner.py --days 1 --type BOTH

      - name: Commit daily report
        run: |
          git config user.name "zone-bot"
          git config user.email "zone-bot@users.noreply.github.com"
          git add reports/
          git commit -m "Daily zone report $(date +%F)" || echo "No changes"
          git push || echo "Push failed (maybe no changes)"
